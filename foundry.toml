[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Paris keeps bytecode compatible with every chain the book targets
# (no PUSH0, which solc 0.8.20+ would otherwise emit). All sources are
# unified at pragma ^0.8.26.
evm_version = "paris"

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 15

[profile.ci]
fuzz = { runs = 1024 }

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
