[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Paris keeps bytecode compatible with every chain the book targets and
# with both solc lines used in the repo (0.8.19 and ^0.8.26).
evm_version = "paris"

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 15

[profile.ci]
fuzz = { runs = 1024 }

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
